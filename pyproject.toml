[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-agent-command-center"
version = "0.1.0"
description = "Local-first multi-agent command center"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vision = "vision.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
